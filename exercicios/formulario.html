<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Formulário</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Informações pessoais</legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu email"><br><br>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required placeholder="Digite seu telefone"><br><br>
            <fieldset>
                <legend>Gênero</legend>
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label><br>
                <input type="radio" id="feminino" name="genero" value="feminino">
                <label for="feminino">Feminino</label><br><br>
            </fieldset>
        </fieldset>
        <fieldset>
            <legend>Escolaridade</legend>
            <select name="escolaridade" id="escolaridade">
                <option value="op0">-------------------------</option>
                <option value="op1">Ensino Fundamental</option>
                <option value="op2">Ensino Médio</option>
                <option value="op3">Ensino Técnico</option>
                <option value="op4">Ensino Superior</option>
            </select>
            <br><br><br>
            <label for="msg">Mensagem:</label><br>
            <textarea name="msg" id="msg" rows="3px" cols="25px" required autocorrect="on">
            </textarea>
        </fieldset>
        <hr>
        <button type="button" id="enviar" onclick="alert('Enviado!')">Enviar</button>
        <button type="reset" id="limpar">Limpar</button>
    </form>
</body>
</html>
